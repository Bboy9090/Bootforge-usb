[package]
name = "libbootforge"
version = "0.1.0"
edition = "2021"
authors = ["BootForge Contributors"]
license = "MIT OR Apache-2.0"
description = "Low-level USB device detection library for hardware discovery, repair workflows, and device preparation"
repository = "https://github.com/Bboy9090/Bootforge-usb"

[dependencies]
rusb = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

[dev-dependencies]
rstest = "0.18"
