[package]
name = "libbootforge"
version = "0.1.0"
edition = "2021"
authors = ["BootForge Contributors"]
license = "MIT OR Apache-2.0"
description = "Low-level forensic USB detection, identity correlation, and event intelligence library"
repository = "https://github.com/Bboy9090/Bootforge-usb"

[features]
default = []
arcwyre = []

[dependencies]
rusb = "=0.9.4"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
thiserror = "=1.0.69"
chrono = { version = "=0.4.44", features = ["serde"] }
sha2 = "=0.10.9"

[dev-dependencies]
rstest = "=0.18.2"
