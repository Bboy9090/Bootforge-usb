name: BootForge Desktop Matrix

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    paths:
      - "apps/workshop-ui/**"
      - "libbootforge/**"
      - ".github/workflows/desktop-matrix.yml"
  push:
    branches:
      - "feature/cross-platform-media-matrix"

jobs:
  desktop:
    name: BootForge desktop / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: bootforge-windows
            bundle_path: apps/workshop-ui/src-tauri/target/release/bundle
          - os: macos-latest
            artifact: bootforge-macos
            bundle_path: apps/workshop-ui/src-tauri/target/release/bundle
          - os: ubuntu-latest
            artifact: bootforge-linux
            bundle_path: apps/workshop-ui/src-tauri/target/release/bundle
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: apps/workshop-ui

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/workshop-ui/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.0-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libusb-1.0-0-dev \
            pkg-config

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build desktop bundles
        run: npm run desktop:build

      - name: Upload platform bundles
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bundle_path }}
          if-no-files-found: error
          retention-days: 14
