name: UEFI application boot certification
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'firmware/uefi/**'
      - 'scripts/uefi-application-boot-smoke.sh'
      - '.github/workflows/uefi-application-boot.yml'
  push:
    branches: [main]
    paths:
      - 'firmware/uefi/**'
      - 'scripts/uefi-application-boot-smoke.sh'
      - '.github/workflows/uefi-application-boot.yml'
jobs:
  qemu-uefi-boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install virtual-only UEFI boot dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf dosfstools mtools clang lld file
      - name: Find packaged x86-64 EDK2 firmware
        id: fw
        shell: bash
        run: |
          set -euo pipefail
          for f in /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/OVMF/OVMF_CODE.fd; do
            if [[ -s "$f" ]]; then echo "path=$f" >> "$GITHUB_OUTPUT"; exit 0; fi
          done
          echo 'No OVMF x86-64 firmware found' >&2
          exit 1
      - name: Boot EFI executable in isolated QEMU
        run: bash scripts/uefi-application-boot-smoke.sh '${{ steps.fw.outputs.path }}'
