name: Windows USB read-only identity preflight
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/windows/**'
      - '.github/workflows/windows-usb-readonly-preflight.yml'
jobs:
  native-windows-negative-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify PowerShell fail-closed disk identity checks
        shell: pwsh
        run: ./scripts/windows/test-usb-readonly-preflight.ps1
