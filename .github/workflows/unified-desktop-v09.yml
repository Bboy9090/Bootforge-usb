name: BootForge v0.9 Native Authority Gate

on:
  workflow_dispatch:
  push:
    branches:
      - feature/unified-desktop-v0.9
    paths:
      - "nextgen/v0.9/**"
      - ".github/workflows/unified-desktop-v09.yml"

permissions:
  contents: read

jobs:
  native:
    name: v0.9 native / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reconstruct and authenticate exact v0.9 RC
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import glob
          import hashlib
          import pathlib
          import zipfile

          root = pathlib.Path("nextgen/v0.9")
          parts = sorted(glob.glob(str(root / "BootForge_v0.9_unified_desktop_rc.zip.b64.part*")))
          if len(parts) != 8:
              raise SystemExit(f"expected 8 payload chunks, found {len(parts)}")

          encoded = "".join(pathlib.Path(p).read_text(encoding="utf-8") for p in parts)
          raw = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(raw).hexdigest()
          expected = "d457ba1d23fcb97a3bd993b446e198c565224714171f51d82031b5d65510820f"
          if digest != expected:
              raise SystemExit(f"RC checksum mismatch: {digest} != {expected}")

          archive = root / "BootForge_v0.9_unified_desktop_rc.zip"
          archive.write_bytes(raw)
          out = root / "unpacked"
          out.mkdir(exist_ok=True)
          with zipfile.ZipFile(archive) as zf:
              zf.testzip()
              zf.extractall(out)
          print(f"authenticated {len(raw)} bytes: {digest}")
          PY

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Linux desktop prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config

      - name: Normalize Rust formatting for compiler authority
        working-directory: nextgen/v0.9/unpacked/BootForge
        run: cargo fmt --all

      - name: Apply audited v0.9.1 source corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("nextgen/v0.9/unpacked/BootForge/crates/bootforge-executor/src/lib.rs")
          text = path.read_text(encoding="utf-8")
          old = "assert_eq!(result.bytes_written, 21);"
          new = "assert_eq!(result.bytes_written, 20);"
          if text.count(old) != 1:
              raise SystemExit("expected exactly one stale 21-byte assertion")
          path.write_text(text.replace(old, new), encoding="utf-8")

          core = Path("nextgen/v0.9/unpacked/BootForge/crates/bootforge-core/src/lib.rs")
          core_text = core.read_text(encoding="utf-8")
          old_fixture = """        let base = std::env::temp_dir().join(format!(
            "bootforge-chromebook-{name}-{}",
            std::process::id()
        ));"""
          new_fixture = """        static NEXT_TEMP_ID: std::sync::atomic::AtomicU64 =
            std::sync::atomic::AtomicU64::new(0);
        let temp_id = NEXT_TEMP_ID.fetch_add(1, std::sync::atomic::Ordering::Relaxed);
        let base = std::env::temp_dir().join(format!(
            "bootforge-chromebook-{name}-{}-{temp_id}",
            std::process::id()
        ));"""
          if core_text.count(old_fixture) != 1:
              raise SystemExit("expected exactly one shared Chromebook fixture path")
          core.write_text(core_text.replace(old_fixture, new_fixture), encoding="utf-8")

          root_cargo = Path("nextgen/v0.9/unpacked/BootForge/Cargo.toml")
          root_text = root_cargo.read_text(encoding="utf-8")
          root_cargo.write_text(root_text.replace('version = "0.9.0"', 'version = "0.9.1"', 1), encoding="utf-8")

          desktop = Path("nextgen/v0.9/unpacked/BootForge/apps/bootforge-desktop/src-tauri/Cargo.toml")
          cargo = desktop.read_text(encoding="utf-8").replace('version = "0.9.0"', 'version = "0.9.1"', 1)
          if "[workspace]" not in cargo:
              cargo = cargo.rstrip() + "\n\n[workspace]\n"
          desktop.write_text(cargo, encoding="utf-8")

          config = desktop.parent / "tauri.conf.json"
          config.write_text(
              config.read_text(encoding="utf-8").replace('"version": "0.9.0"', '"version": "0.9.1"', 1),
              encoding="utf-8",
          )

          # The RC omitted Tauri icon assets. Generate deterministic valid assets
          # solely for compile authority; the branded release icon remains a later packaging gate.
          import binascii, struct, zlib
          icon_dir = desktop.parent / "icons"
          icon_dir.mkdir(parents=True, exist_ok=True)

          def png_chunk(kind, payload):
              return (
                  struct.pack(">I", len(payload))
                  + kind
                  + payload
                  + struct.pack(">I", binascii.crc32(kind + payload) & 0xffffffff)
              )

          width = height = 32
          rows = []
          for y in range(height):
              row = bytearray([0])
              for x in range(width):
                  edge = x < 3 or y < 3 or x >= width - 3 or y >= height - 3
                  if edge:
                      row.extend((24, 32, 44, 255))
                  else:
                      row.extend((52, 120, 246, 255))
              rows.append(bytes(row))
          rgba = b"".join(rows)
          png = (
              b"\x89PNG\r\n\x1a\n"
              + png_chunk(b"IHDR", struct.pack(">IIBBBBB", width, height, 8, 6, 0, 0, 0))
              + png_chunk(b"IDAT", zlib.compress(rgba, 9))
              + png_chunk(b"IEND", b"")
          )
          (icon_dir / "icon.png").write_bytes(png)
          ico = (
              struct.pack("<HHH", 0, 1, 1)
              + struct.pack("<BBBBHHII", width, height, 0, 0, 1, 32, len(png), 22)
              + png
          )
          (icon_dir / "icon.ico").write_bytes(ico)
          PY

      - name: Reformat corrected Rust sources
        working-directory: nextgen/v0.9/unpacked/BootForge
        run: cargo fmt --all

      - name: Build core workspace
        working-directory: nextgen/v0.9/unpacked/BootForge
        run: cargo build --workspace --all-targets

      - name: Test core workspace
        working-directory: nextgen/v0.9/unpacked/BootForge
        run: cargo test --workspace --all-targets

      - name: Clippy core workspace
        working-directory: nextgen/v0.9/unpacked/BootForge
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build Tauri desktop shell
        working-directory: nextgen/v0.9/unpacked/BootForge
        run: cargo build --manifest-path apps/bootforge-desktop/src-tauri/Cargo.toml

      - name: Clippy Tauri desktop shell
        working-directory: nextgen/v0.9/unpacked/BootForge
        run: cargo clippy --manifest-path apps/bootforge-desktop/src-tauri/Cargo.toml -- -D warnings

      - name: Upload qualified v0.9.1 source tree
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: BootForge-v0.9.1-qualified-source
          path: nextgen/v0.9/unpacked/BootForge
          if-no-files-found: error
          retention-days: 14
