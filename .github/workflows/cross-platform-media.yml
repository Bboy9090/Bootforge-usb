name: Cross-Platform Media Matrix

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    paths:
      - "libbootforge/**"
      - "bootforge-writer/**"
      - "docs/CROSS_PLATFORM_MEDIA_MATRIX.md"
      - "docs/EXTERNAL_EXECUTOR_CONTRACT.md"
      - ".github/workflows/cross-platform-media.yml"
  push:
    branches:
      - "feature/cross-platform-media-matrix"

env:
  CARGO_TERM_COLOR: always

jobs:
  libbootforge:
    name: media contract / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux libusb
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev pkg-config

      - name: Format
        run: cargo fmt --check --package libbootforge --package bootforge-writer

      - name: Build read-only core
        run: cargo build --package libbootforge --all-targets --verbose

      - name: Build executor handoff contract
        run: cargo build --package bootforge-writer --all-targets --verbose

      - name: Test read-only core
        run: cargo test --package libbootforge --all-targets --verbose

      - name: Test executor handoff contract
        run: cargo test --package bootforge-writer --all-targets --verbose

      - name: Clippy read-only core
        run: cargo clippy --package libbootforge --all-targets -- -D warnings

      - name: Clippy executor handoff contract
        run: cargo clippy --package bootforge-writer --all-targets -- -D warnings
