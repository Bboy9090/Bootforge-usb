name: Phoenix Key Windows Desktop

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    paths:
      - "apps/workshop-ui/**"
      - "libbootforge/**"
      - ".github/workflows/windows-desktop.yml"
  push:
    tags: ["phoenix-key-v*"]

jobs:
  windows-installer:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/workshop-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/workshop-ui/package-lock.json
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: npm ci
      - name: Build Phoenix Key installers
        run: npm run desktop:build
      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: phoenix-key-windows-installers
          path: |
            apps/workshop-ui/src-tauri/target/release/bundle/msi/*.msi
            apps/workshop-ui/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
