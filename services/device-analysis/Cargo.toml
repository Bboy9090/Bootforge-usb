[package]
name = "device-analysis"
version = "0.1.0"
edition = "2021"

[dependencies]
libbootforge = { path = "../../libbootforge" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
chrono = { version = "=0.4.44", features = ["serde"] }
uuid = { version = "=1.23.1", features = ["v4", "serde"] }

[dev-dependencies]
rstest = "=0.18.2"
